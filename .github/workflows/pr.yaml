---
name: PR
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
concurrency:
  group: ${{ github.ref }}-build
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  build-binaries:
    name: Binary ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-22.04-4
            build_command: nix build -L .#binary-gnosis_vpn-server-x86_64-linux
            required_label: ""
          - architecture: aarch64-linux
            runner: depot-ubuntu-22.04-4-arm
            build_command: nix build -L .#binary-gnosis_vpn-server-aarch64-linux
            required_label: "binary:aarch64-linux"
    uses: hoprnet/hopr-workflows/.github/workflows/build-binaries.yaml@build-binaries-v2
    permissions:
      contents: read
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      version_type: commit
      architecture: ${{ matrix.architecture }}
      cachix_cache_name: gnosis-vpn-server
      build_command: ${{ matrix.build_command }}
      binary: gnosis_vpn-server
      runner: ${{ matrix.runner }}
      enabled: ${{ matrix.required_label == '' || contains(github.event.pull_request.labels.*.name, matrix.required_label)
        }}
    secrets:
      gcp_service_account: ${{ secrets.GCP_SA_GITHUB_ACTIONS }}
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      gpg_private_key_password: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}
  build-docker:
    name: Docker
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@build-docker-v2
    needs: build-binaries
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      version_type: commit
      build_matrix: |
        [
          {
            "runner": "depot-ubuntu-22.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix run .#docker-gnosis_vpn-server-x86_64-linux"
          }
        ]
      cachix_cache_name: gnosis-vpn-server
      docker_image_name: gnosis_vpn-server
      docker_gcp_registry: europe-west3-docker.pkg.dev/gnosisvpn-production/docker-images
      docker_image_format: docker
      docker_bucket_sboms: gnosisvpn-production-docker-images-sboms
      fail_on_scan_vulnerabilities: ${{ vars.FAIL_ON_SCAN_VULNERABILITIES }}
    secrets:
      gcp_service_account: ${{ secrets.GCP_SA_GITHUB_ACTIONS }}
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  checks:
    name: Checks
    runs-on: depot-ubuntu-22.04-4
    steps:
      - name: Run checks
        uses: hoprnet/hopr-workflows/actions/nix-action@nix-action-v1
        with:
          source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
          cachix_cache_name: gnosis-vpn-server
          cachix_auth_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          command: nix flake check -L --show-trace --max-jobs 1
