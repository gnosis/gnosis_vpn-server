---
name: PR
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
concurrency:
  group: ${{ github.ref }}-build
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  build-binaries:
    name: Binary ${{ matrix.architecture }}
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-22.04-4
            build_command: nix build -L .#binary-gnosis_vpn-server-x86_64-linux
            required_label: ""
          - architecture: aarch64-linux
            runner: depot-ubuntu-22.04-arm-4
            build_command: nix build -L .#binary-gnosis_vpn-server-aarch64-linux
            required_label: "binary:aarch64-linux"
    uses: hoprnet/hopr-workflows/.github/workflows/build-binaries.yaml@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # build-binaries-v3.1.1
    permissions:
      contents: read
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      version_type: commit
      architecture: ${{ matrix.architecture }}
      cachix_cache_name: gnosis-vpn-server
      build_command: ${{ matrix.build_command }}
      binary: gnosis_vpn-server
      runner: ${{ matrix.runner }}
      enabled: ${{ matrix.required_label == '' || contains(github.event.pull_request.labels.*.name, 'binary:all') || contains(github.event.pull_request.labels.*.name,
        matrix.required_label) }}
      gcp_workload_identity_provider: projects/656686060169/locations/global/workloadIdentityPools/gnosisvpn-gh-pool/providers/github-provider
      gcp_service_account: download-gnosisvpn-gh-sa@gnosisvpn-production.iam.gserviceaccount.com
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      gpg_private_key_password: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}
  build-docker:
    name: Docker
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # build-docker-v3.1.2
    needs: build-binaries
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      version_type: commit
      build_matrix: |
        [
          {
            "runner": "depot-ubuntu-22.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix run .#docker-gnosis_vpn-server-x86_64-linux"
          }
        ]
      cachix_cache_name: gnosis-vpn-server
      docker_image_name: gnosis_vpn-server
      docker_gcp_registry: europe-west3-docker.pkg.dev/gnosisvpn-production/docker-images
      docker_image_format: docker
      docker_bucket_sboms: gnosisvpn-production-docker-images-sboms
      fail_on_scan_vulnerabilities: ${{ vars.FAIL_ON_SCAN_VULNERABILITIES }}
      gcp_workload_identity_provider: projects/656686060169/locations/global/workloadIdentityPools/gnosisvpn-gh-pool/providers/github-provider
      gcp_service_account: download-gnosisvpn-gh-sa@gnosisvpn-production.iam.gserviceaccount.com
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  checks:
    name: Checks
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    permissions:
      contents: read
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@1476429c0d8c5a6331c50a4655501125051cdbf4 # workflow-checks-v2.1.2
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      cachix_cache_name: gnosis-vpn-server
      # No `.#check` app or `.#ci` devshell here; `nix flake check` already covers clippy/docs/test/licenses.
      format: false
      pre_commit: false
      deps: false
      lint_command: nix flake check -L --show-trace
      audit_command: nix run -L .#audit
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  ci-ok:
    name: CI OK
    # Single required status check: stable across matrix expansion, label gating and fork guards.
    if: always() # a skipped job counts as passing, so never let a failed dependency skip this one
    needs: [build-binaries, build-docker, checks]
    runs-on: depot-ubuntu-22.04-4
    permissions: {}
    steps:
      - name: Fail if any CI job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
