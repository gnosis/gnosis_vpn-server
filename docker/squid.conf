http_port 0.0.0.0:3128
acl SSL_ports port 443
acl CONNECT method CONNECT

# Allow WireGuard clients
acl wg_clients src 10.129.0.0/9

# Allow CONNECT for SSL ports (but SNI blocking still applies)
http_access allow CONNECT SSL_ports

# Final access rules
http_access allow wg_clients
http_access deny all
cache deny all
