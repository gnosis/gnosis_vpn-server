# IP range of allowed VPN clients
allowed_client_ips = { start = "10.128.0.2", end = "10.128.0.10" }
# wg server configuration path - will be managed by gnosis_vpn-server for persisting wg state
# needs a minimal interface section and will keep the interface section as is
# e.g.:
# [Interface]
# PrivateKey = <server private key>
# Address = 10.128.0.1/32
# PostUp = iptables -t nat -A POSTROUTING -s 10.128.0.0/9 -o ens3 -j MASQUERADE
# PostDown = iptables -t nat -D POSTROUTING -s 10.128.0.0/9 -o ens3 -j MASQUERADE
wireguard_config_path = "./wggnosisvpn.conf"

# [optional] server endpoint
# endpoint = "127.0.0.1:8000"
# [optional] determines when a client is considered disconnected
# should be greater than the WireGuard keepalive interval (usually 60 seconds)
# otherwise clients will have to recover constantly from dropping connections
# client_handshake_timeout_s = 300
# [optional] interval at which client removal job is run if enabled
# client_cleanup_interval_s = 180
