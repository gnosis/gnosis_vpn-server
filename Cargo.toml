[package]
edition = "2024"
license = "GPL-3.0"
name    = "gnosis_vpn-server"
version = "0.4.3"

[lib]
name = "gnosis_vpn_server"
path = "src/lib.rs"

[dependencies]
anyhow             = "1.0.102"
clap               = { version = "4.6.1", features = ["derive", "env"] }
figment            = "0.10.19"
prometheus         = "0.14"
rand               = "0.10.1"
rocket             = { version = "0.5.1", features = ["json"] }
serde              = { version = "1.0.228", features = ["derive"] }
serde_json         = "1.0"
thiserror          = "2.0"
tokio              = { version = "1.52.1", features = ["rt", "time"] }
toml               = "0.9"
tracing            = "0.1"
tracing-subscriber = "0.3"
