[package]
name = "gnosis_vpn-server"
version = "0.3.1"
edition = "2024"
license = "GPL-3.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
figment = "0.10"
prometheus = "0.14"
rand = "0.9"
rocket = { version = "0.5", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43.0", features = ["rt", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
