[package]
edition = "2024"
license = "GPL-3.0"
name    = "gnosis_vpn-server"
version = "0.6.1"

[lib]
name = "gnosis_vpn_server"
path = "src/lib.rs"

[dependencies]
anyhow     = "1.0.104"
clap       = { version = "4.6.6", features = ["derive", "env"] }
figment    = "0.10.19"
prometheus = "0.14"
rand       = "0.10.2"
# no http2: it pulls in the EOL h2 0.3 (RUSTSEC-2026-0258) and we serve plain HTTP
rocket             = { version = "0.5.1", default-features = false, features = ["json"] }
rustix             = { version = "1.1.4", features = ["fs"] }
serde              = { version = "1.0.229", features = ["derive"] }
serde_json         = "1.0.151"
thiserror          = "2.0.20"
tokio              = { version = "1.53.1", features = ["rt", "time"] }
toml               = "1.1.4"
tracing            = "0.1.44"
tracing-subscriber = "0.3.23"
